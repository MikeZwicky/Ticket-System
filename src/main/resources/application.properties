# Server
server.port=8080
server.forward-headers-strategy=framework

spring.application.name=ticket-system

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

######################################################################################

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=TicketSystem
spring.datasource.password=pw
spring.sql.init.platform=h2

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate Configuration - create schema at startup and drop at shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Show formatted SQL statements in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure data.sql runs after Hibernate schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

######################################################################################

#Security
spring.security.user.name=TicketSystem
spring.security.user.password=pw

